apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: echo
  namespace: k8s-factory
spec:
  serviceName: "echo"
  replicas: 2
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
      - name: echo
        image: hashicorp/http-echo:latest
        args:
          - "-text=Hello from echo server"
        ports:
        - containerPort: 5678
