# Temporary permissions for Terraform deployment
# These are removed automatically after deployment completes

# Package management for containerd and Kubernetes
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/apt update
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/apt install -y *
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/apt-mark hold *
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/apt-key add -

# Directory and file operations
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/mkdir -p /etc/containerd
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/tee *

# Containerd configuration
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/containerd config default
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/sed -i *
k8s-admin ALL=(ALL) NOPASSWD: /usr/sbin/modprobe overlay
k8s-admin ALL=(ALL) NOPASSWD: /usr/sbin/modprobe br_netfilter

# Service management for containerd
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart containerd
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/systemctl enable containerd

# Kubernetes initialization
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/swapoff -a
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/sed -i '/ swap / s/^/#/' /etc/fstab
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/kubeadm init *

# Self-cleanup permissions
k8s-admin ALL=(ALL) NOPASSWD: /bin/rm -f /etc/sudoers.d/terraform_temp
