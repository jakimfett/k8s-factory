# Temporary permissions for initial Terraform setup - apt and package management
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/apt-get update
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/apt-get install -y apt-transport-https ca-certificates curl gnupg lsb-release
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/apt-get install -y containerd.io
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/apt-get install -y kubelet kubeadm kubectl
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/apt-key add -
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/apt-mark hold kubelet kubeadm kubectl

# Docker/containerd repository setup 
k8s-admin ALL=(ALL) NOPASSWD: /tmp/add_docker_repo.sh
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/install -m 0755 -d /etc/apt/keyrings
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/gpg --dearmor -o /etc/apt/keyrings/docker.gpg
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/chmod a+r /etc/apt/keyrings/docker.gpg

# Configuration file operations
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/tee /etc/apt/sources.list.d/docker.list
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/tee /etc/apt/sources.list.d/kubernetes.list
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/tee /etc/modules-load.d/containerd.conf
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/tee /etc/sysctl.d/99-kubernetes-cri.conf
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/tee /etc/containerd/config.toml
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/tee /tmp/kubeadm-config.yaml

# System operations for Kubernetes
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/containerd config default
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/sed -i /etc/containerd/config.toml
k8s-admin ALL=(ALL) NOPASSWD: /usr/sbin/modprobe overlay
k8s-admin ALL=(ALL) NOPASSWD: /usr/sbin/modprobe br_netfilter
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart containerd
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/systemctl enable containerd
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/swapoff -a
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/sed -i '/ swap / s/^/#/' /etc/fstab
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/kubeadm init --config=/tmp/kubeadm-config.yaml --upload-certs

# Cleanup
k8s-admin ALL=(ALL) NOPASSWD: /bin/rm -f /etc/sudoers.d/terraform_temp
