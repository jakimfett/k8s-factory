# Permanent sudo permissions for k8s-admin user
# These permissions follow the principle of least privilege
# Passwordless access is limited to Kubernetes operations only

# Kubernetes-specific commands that don't require password
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/kubeadm, /usr/bin/kubelet, /usr/bin/kubectl

# Service management
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/systemctl start kubelet, /usr/bin/systemctl stop kubelet, /usr/bin/systemctl restart kubelet, /usr/bin/systemctl status kubelet, /usr/bin/systemctl enable kubelet
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/systemctl start containerd, /usr/bin/systemctl stop containerd, /usr/bin/systemctl restart containerd, /usr/bin/systemctl status containerd, /usr/bin/systemctl enable containerd

# Network configuration
k8s-admin ALL=(ALL) NOPASSWD: /usr/bin/ip, /usr/sbin/sysctl -w net.bridge.bridge-nf-call-iptables=1, /usr/sbin/sysctl -w net.ipv4.ip_forward=1, /usr/sbin/sysctl -w net.bridge.bridge-nf-call-ip6tables=1, /usr/sbin/sysctl --system

# Required directory operations
k8s-admin ALL=(ALL) NOPASSWD: /bin/mkdir -p /etc/containerd

# Require password for package management and general system operations
k8s-admin ALL=(ALL) /usr/bin/apt, /usr/bin/apt-get, /usr/bin/apt-key, /usr/bin/apt-mark, /usr/bin/systemctl, /usr/bin/tee
